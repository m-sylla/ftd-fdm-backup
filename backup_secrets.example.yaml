# Copy to backup_secrets.yaml and fill in. Do not commit backup_secrets.yaml.
# Used only by backup_to_ftp.py.

# Password for the FTP account named in config.yaml's backup.ftp.username.
ftp_password: "changeme"

# Optional, but Cisco's own API docs recommend setting one: encrypts the FDM
# backup file itself (separate from the FTP transport). Leave blank/omit to
# get an unencrypted backup file.
encryption_key: ""
